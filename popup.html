<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <h1>Apple Music Artwork</h1>
    <label class="option">
      <input type="radio" name="mode" value="show">
      <span class="label-text">Show</span>
    </label>
    <label class="option">
      <input type="radio" name="mode" value="blur">
      <span class="label-text">Blur</span>
    </label>
    <label class="option">
      <input type="radio" name="mode" value="hide">
      <span class="label-text">Hide</span>
    </label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
